
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Recognition System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background:#f5f6f8;
        }
        .stream-box{
            height:500px;
            background:#111;
            color:#aaa;
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius:.5rem;
            border:2px dashed #555;
            overflow:hidden;
        }

        .stream-box img{
            max-width:100%;
            max-height:100%;
            display:none;
        }

        .progress{
            height:25px;
        }

        .card{
            border:none;
            box-shadow:0 2px 8px rgba(0,0,0,.08);
        }
    </style>
</head>

<body>

<div class="container py-4">

    <h2 class="mb-1">
        <i class="bi bi-camera-video-fill text-primary"></i>
        Activity Recognition System
    </h2>

    <p class="text-muted">
        YOLOv8 + ResNet18
    </p>

    <div class="card mb-4">
        <div class="card-body">

            <form>

                <div class="row g-3 align-items-end">

                    <div class="col-md-9">
                        <label class="form-label">Video</label>
                        <input class="form-control" type="file" accept="video/*">
                    </div>

                    <div class="col-md-3 d-grid">
                        <button class="btn btn-primary" type="button">
                            <i class="bi bi-upload"></i>
                            Upload & Process
                        </button>
                    </div>

                </div>

            </form>

        </div>
    </div>


    <div class="row">

        <div class="col-lg-8">

            <div class="card">

                <div class="card-header fw-semibold">
                    Video Stream
                </div>

                <div class="card-body">

                    <div class="stream-box">

                        <div id="placeholder">
                            <i class="bi bi-film" style="font-size:60px"></i>
                            <br><br>
                            Stream video akan muncul di sini
                        </div>

                        <img id="video-stream" src="">

                    </div>

                </div>

            </div>

        </div>


        <div class="col-lg-4">

            <div class="card">

                <div class="card-header fw-semibold">
                    Detection Information
                </div>

                <div class="card-body">

                    <table class="table table-sm">

                        <tr>
                            <th>Status</th>
                            <td>
                                <span class="badge bg-secondary" id="status">
                                    Idle
                                </span>
                            </td>
                        </tr>

                        <tr>
                            <th>Frame</th>
                            <td id="frame">-</td>
                        </tr>

                        <tr>
                            <th>Person</th>
                            <td id="person">-</td>
                        </tr>

                        <tr>
                            <th>FPS</th>
                            <td id="fps">-</td>
                        </tr>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <div class="card mt-4">

        <div class="card-header fw-semibold">
            Processing Progress
        </div>

        <div class="card-body">

            <div class="progress">

                <div
                    class="progress-bar"
                    id="progress-bar"
                    role="progressbar"
                    style="width:0%;">

                    0%

                </div>

            </div>

        </div>

    </div>


    <div class="card mt-4">

        <div class="card-header fw-semibold">
            Current Detection
        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-light">

                <tr>

                    <th>Person</th>

                    <th>Activity</th>

                    <th>Confidence</th>

                </tr>

                </thead>

                <tbody id="activity-table">

                <tr>

                    <td colspan="3" class="text-center text-muted">

                        Belum ada aktivitas terdeteksi

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
