<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Recognize</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{
            background:#f5f6f8;
        }
        .card{
            border:none;
            box-shadow:0 2px 8px rgba(0,0,0,.08);
        }
        .stream-box{
            height:550px;
            background:#111;
            color:#aaa;
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius:.5rem;
            border:2px dashed #555;
            overflow:hidden;
        }

        .stream-box img{
            max-width:100%;
            max-height:100%;
            display:none;
        }
    </style>
</head>
<body>
    <div class="container"> 
        <h2>Prototipe Pengenalan pengajaran dan pembelajaran</h2>
        <div class="card">
            <div class="card-header fw-semibold">
                Video Stream
            </div>
            <div class="card-body">
                <div class="mb-3">
                        <label class="form-label">Nama Praktikum</label>
                        <input type="text" class="form-control" name="name" value="{{ video_process.nama_praktikum }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Jam Mulai</label>
                    <input type="text" class="form-control" name="start_time" value="{{ video_process.waktu_mulai }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Jam Selesai</label>
                    <input type="text" class="form-control" name="end_time" value="{{ video_process.waktu_selesai }}">
                </div>
                <div class="stream-box mx-auto p-2">
                    {% if video_process.status == "COMPLETED" %}
                    <div class="mx-auto p-2">
                        <video controls>
                            <source src="{{ video_process.output_video.url }}" type="video/mp4">
                        </video>
                    </div>
                    {% else %}
                        <div id="placeholder">
                            <i class="bi bi-film" style="font-size:60px"></i>
                            <br><br>
                        </div>
                        <img id="video-stream" src="">
                    {% endif %}
                </div>
            </div>
        </div>
        <div class="card mt-3">
            <div class="card-header fw-semibold">
                Log Aktivitas
            </div>
            <div class="card-body">
                <table class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>Jumlah Orang Terdeteksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>{{ video_process.person_count }}</td>
                        </tr>
                    </tbody>
                </table>
                <div id="activityChart"></div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    {{ summary|json_script:"summary-data" }}

    <script>

    const summary =
        JSON.parse(
            document.getElementById(
                "summary-data"
            ).textContent
        );
    
        
    const categories =
    summary.map(x => x.activity);
    
    const duration =
    summary.map(x => x.duration);
        
    const colorMap = {
        "lecturing": "#41792C",
        "listening": "#2A7DD1",
        "realtime_writing": "#B0138D",
        "usingcomputer": "#FAFA37"
        };

    const colors = summary.map(item => colorMap[item.activity]);
    const options = {

        chart: {
            type: "bar",
            height: 350
        },
        plotOptions: {
            bar: {
                distributed: true
            }
        },
        colors: colors,
        series: [{
            name: "Duration (second)",
            data: duration
        }],
        xaxis: {
            categories: categories
        },
        dataLabels: {
            enabled: true
        },
        yaxis: {
            title: {
                text: "Second"
            }
        }
    };

    new ApexCharts(
        document.querySelector("#activityChart"),
        options
    ).render();

    </script>
</body>
</html>
